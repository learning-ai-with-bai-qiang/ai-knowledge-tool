<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新建知识点</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 14px;
        }

        #topbar {
            flex-shrink: 0;
            background: #252526;
            border-bottom: 1px solid #333;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #back-btn {
            background: transparent;
            border: 1px solid #444;
            color: #ccc;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
        }
        #back-btn:hover {
            background: #2d2d35;
            color: #fff;
            border-color: #409eff;
        }

        #page-title {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
        }
        #page-title .edit-tag {
            color: #ffd93d;
            font-size: 12px;
            font-weight: normal;
            margin-left: 8px;
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 32px;
            gap: 12px;
            overflow: hidden;
        }

        #script-label {
            flex-shrink: 0;
            font-size: 13px;
            color: #888;
        }

        #script-input {
            flex: 1;
            min-height: 0;
            width: 100%;
            padding: 16px 18px;
            background: #2d2d2d;
            color: #e0e0e0;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.7;
            resize: none;
            outline: none;
        }
        #script-input:focus { border-color: #409eff; }
        #script-input::placeholder { color: #666; }

        #btn-bar {
            flex-shrink: 0;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            padding: 9px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            border: 1px solid #444;
            background: #3a3a3a;
            color: #ddd;
            transition: 0.15s;
        }
        .btn:hover {
            background: #4a4a4a;
            border-color: #409eff;
            color: #fff;
        }
        .btn.primary {
            background: #409eff;
            color: #fff;
            border-color: #409eff;
        }
        .btn.primary:hover {
            background: #66b1ff;
            border-color: #66b1ff;
        }

        #toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #409eff;
            color: #fff;
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
            z-index: 9999;
        }
        #toast.show { opacity: 1; }

        .ctx-item:hover { background: #409eff; color: #fff; }
    </style>
</head>
<body>

    <div id="topbar">
        <button id="back-btn">← 返回首页</button>
        <div id="page-title">新建知识点</div>
    </div>

    <div id="main">
        <div id="script-label">把你的经验、坑、知识点，写在这里 ↓</div>
        <textarea id="script-input" placeholder="想到哪写到哪，不用管格式，AI 会帮你整理..."></textarea>
        <div id="btn-bar">
            <button id="btn-prompt" class="btn">📋 拼接提示词</button>
            <button id="btn-import" class="btn primary">✅ 导入配置</button>
        </div>
    </div>

    <div id="toast"></div>

    <!-- 查重弹窗 -->
    <div id="dupModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:9998; align-items:center; justify-content:center;">
        <div style="background:#2d2d2d; border:1px solid #444; border-radius:12px; padding:26px 30px; min-width:480px; max-width:640px; box-shadow:0 10px 40px rgba(0,0,0,0.5);">
            <div style="font-size:16px; font-weight:bold; color:#ffd93d; margin-bottom:18px;">⚠️ 发现可能重复的知识点</div>

            <div style="background:#1e1e1e; border-radius:10px; padding:18px 20px; margin-bottom:20px;">
                <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;">
                    <div id="dup-title" style="font-size:16px; font-weight:bold; color:#fff;"></div>
                    <div id="dup-score" style="font-size:13px; color:#ff7676; font-weight:bold;"></div>
                </div>
                <div id="dup-summary" style="font-size:13px; color:#aaa; line-height:1.6; margin-bottom:10px;"></div>
                <div id="dup-tags" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
            </div>

            <div style="font-size:13px; color:#888; margin-bottom:20px;">如果已经录入过，就别重复录入了。点「查看这条」去看完整页面。</div>

            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button id="dup-cancel" style="padding:9px 20px; border-radius:6px; border:1px solid #444; background:#3a3a3a; color:#ddd; cursor:pointer; font-family:inherit; font-size:14px;">取消</button>
                <button id="dup-view" style="padding:9px 20px; border-radius:6px; border:1px solid #409eff; background:transparent; color:#66b1ff; cursor:pointer; font-family:inherit; font-size:14px;">👁 查看这条</button>
                <button id="dup-continue" class="primary" style="padding:9px 20px; border-radius:6px; border:1px solid #409eff; background:#409eff; color:#fff; cursor:pointer; font-family:inherit; font-size:14px;">仍然拼接</button>
            </div>
        </div>
    </div>

    <!-- 右键菜单 -->
    <div id="ctxMenu" style="display:none; position:fixed; z-index:9999; background:#2d2d2d; border:1px solid #444; border-radius:6px; padding:6px 0; box-shadow:0 6px 24px rgba(0,0,0,0.5); min-width:110px;">
        <div class="ctx-item" data-action="cut" style="padding:8px 20px; cursor:pointer; font-size:14px;">剪切</div>
        <div class="ctx-item" data-action="copy" style="padding:8px 20px; cursor:pointer; font-size:14px;">复制</div>
        <div class="ctx-item" data-action="paste" style="padding:8px 20px; cursor:pointer; font-size:14px;">粘贴</div>
        <div class="ctx-item" data-action="selectall" style="padding:8px 20px; cursor:pointer; font-size:14px;">全选</div>
    </div>

    <script>
        const scriptInput = document.getElementById("script-input");
        const toast = document.getElementById("toast");
        const dupModal = document.getElementById("dupModal");
        let pendingText = "";
        let pendingMatch = null;

        const EDIT_ID = new URLSearchParams(window.location.search).get("edit") || "";

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2500);
        }

        // ============ 启动 ============
        console.log("init 开始执行");
        async function init() {
            console.log("【init】开始");
            if (EDIT_ID) {
                console.log("【init】编辑模式");
                document.getElementById("page-title").innerHTML =
                    "编辑知识点 <span class='edit-tag'>（重新编辑会覆盖原内容）</span>";
                const r = await window.pywebview.api.get_source(EDIT_ID);
                if (r && r.ok && r.text) {
                    scriptInput.value = r.text;
                }
            } else {
                console.log("【init】准备读草稿");
                const r = await window.pywebview.api.load_draft();
                console.log("【init】草稿返回 =", r);
                if (r && r.ok && r.text) {
                    scriptInput.value = r.text;
                    console.log("【init】已填入文案框");
                } else {
                    console.log("【init】草稿为空");
                }
            }
        }
        console.log("pywebviewready 监听已注册");
        window.addEventListener("pywebviewready", init);

        // ============ 文案区实时存草稿 ============
        // ============ 每秒自动保存一次草稿（规避中文输入法干扰） ============
        setInterval(() => {
            if (!EDIT_ID && window.pywebview && window.pywebview.api) {
                window.pywebview.api.save_draft(scriptInput.value);
            }
        }, 1000);
        // ============ 返回首页 ============
        document.getElementById("back-btn").addEventListener("click", () => {
            location.href = "index.html";
        });

        // ============ 拼接提示词 ============
        document.getElementById("btn-prompt").addEventListener("click", async () => {
            const text = scriptInput.value.trim();
            if (!text) {
                showToast("请先写点东西");
                return;
            }

            const dup = await window.pywebview.api.check_duplicate(text);
            if (dup && dup.ok && dup.match) {
                pendingText = text;
                pendingMatch = dup.match;

                document.getElementById("dup-title").textContent = "《" + dup.match.title + "》";
                document.getElementById("dup-score").textContent = "相似度 " + dup.match.score + "%";
                document.getElementById("dup-summary").textContent = dup.match.summary || "（无摘要）";

                const tagsBox = document.getElementById("dup-tags");
                tagsBox.innerHTML = "";
                (dup.match.tags || []).forEach(t => {
                    const tag = document.createElement("span");
                    tag.style.cssText = "font-size:11px; padding:2px 8px; background:rgba(64,158,255,0.15); color:#66b1ff; border-radius:10px;";
                    tag.textContent = t;
                    tagsBox.appendChild(tag);
                });

                dupModal.style.display = "flex";
                return;
            }

            await doBuildPrompt(text);
        });

        // 查重弹窗按钮
        document.getElementById("dup-cancel").addEventListener("click", () => {
            dupModal.style.display = "none";
            pendingText = "";
            pendingMatch = null;
        });

        document.getElementById("dup-view").addEventListener("click", () => {
            if (!pendingMatch) return;
            dupModal.style.display = "none";
            location.href = "knowledge_engine.html?id=" + pendingMatch.id +
                "&back=" + encodeURIComponent("workbench.html");
        });

        document.getElementById("dup-continue").addEventListener("click", async () => {
            dupModal.style.display = "none";
            const text = pendingText;
            pendingText = "";
            pendingMatch = null;
            await doBuildPrompt(text);
        });

        // 真正的拼接逻辑
        async function doBuildPrompt(text) {
            const result = await window.pywebview.api.build_prompt(text);
            if (!result || !result.ok) {
                showToast("❌ 拼接失败：" + (result && result.msg || "未知错误"));
                return;
            }

            try {
                await navigator.clipboard.writeText(result.prompt);
            } catch (err) {
                const ta = document.createElement("textarea");
                ta.value = result.prompt;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
            }

            showToast("✅ 已复制到剪贴板，去粘贴给 AI");
        }

        // ============ 导入配置 ============
        document.getElementById("btn-import").addEventListener("click", async () => {
            const text = scriptInput.value.trim();
            const result = await window.pywebview.api.import_config(text, EDIT_ID || null);

            if (!result || !result.ok) {
                showToast("❌ 导入失败：" + (result && result.msg || "未知错误"));
                return;
            }

            showToast("✅ 已导入，即将打开预览...");
            scriptInput.value = "";                        // 先清空文案框
            await window.pywebview.api.clear_draft();      // 再清空草稿
            setTimeout(() => {
                location.href = "knowledge_engine.html?id=" + result.id;
            }, 600);
        });

        // ============ 文案区右键菜单 ============
        const ctxMenu = document.getElementById("ctxMenu");

        scriptInput.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            ctxMenu.style.left = e.clientX + "px";
            ctxMenu.style.top = e.clientY + "px";
            ctxMenu.style.display = "block";
        });

        document.addEventListener("click", (e) => {
            if (!ctxMenu.contains(e.target)) {
                ctxMenu.style.display = "none";
            }
        });

        ctxMenu.querySelectorAll(".ctx-item").forEach(item => {
            item.addEventListener("click", async () => {
                const action = item.dataset.action;
                ctxMenu.style.display = "none";

                if (action === "cut") {
                    const sel = scriptInput.value.substring(scriptInput.selectionStart, scriptInput.selectionEnd);
                    if (!sel) return;
                    try {
                        await navigator.clipboard.writeText(sel);
                    } catch (err) {
                        const ta = document.createElement("textarea");
                        ta.value = sel;
                        ta.style.position = "fixed";
                        ta.style.opacity = "0";
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand("copy");
                        document.body.removeChild(ta);
                    }
                    const start = scriptInput.selectionStart;
                    const end = scriptInput.selectionEnd;
                    scriptInput.value = scriptInput.value.substring(0, start) + scriptInput.value.substring(end);
                    scriptInput.selectionStart = scriptInput.selectionEnd = start;

                } else if (action === "copy") {
                    const sel = scriptInput.value.substring(scriptInput.selectionStart, scriptInput.selectionEnd);
                    if (!sel) return;
                    try {
                        await navigator.clipboard.writeText(sel);
                    } catch (err) {
                        const ta = document.createElement("textarea");
                        ta.value = sel;
                        ta.style.position = "fixed";
                        ta.style.opacity = "0";
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand("copy");
                        document.body.removeChild(ta);
                    }

                } else if (action === "paste") {
                    const text = await window.pywebview.api.read_clipboard();
                    if (!text) return;
                    const start = scriptInput.selectionStart;
                    const end = scriptInput.selectionEnd;
                    const val = scriptInput.value;
                    scriptInput.value = val.substring(0, start) + text + val.substring(end);
                    scriptInput.selectionStart = scriptInput.selectionEnd = start + text.length;
                    scriptInput.focus();

                } else if (action === "selectall") {
                    scriptInput.focus();
                    scriptInput.select();
                }
            });
        });
    </script>

</body>
</html>
